name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - name: Verify tag and shared version
        run: node scripts/sync-core-version.mjs --check --tag "${{ github.ref_name }}"

      - name: Build Python distributions
        run: uv build packages/core

      - name: Smoke-test CLI
        run: uv run --project packages/core Final2x-core -h

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: packages/core/dist/*

  windows:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project packages/core --locked --no-default-groups --group dev

      - name: Build bundled core
        run: pnpm run core:bundle

      - name: Smoke-test bundled core
        run: resources\Final2x-core\Final2x-core.exe -h

      - name: Build desktop app
        run: pnpm run build:win-${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive unpacked app
        shell: pwsh
        run: |
          $directory = if ('${{ matrix.arch }}' -eq 'x64') { 'dist/win-unpacked' } else { 'dist/win-arm64-unpacked' }
          7z a -r "Final2x-windows-${{ matrix.arch }}-unpacked.7z" "$directory/*"

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-windows-${{ matrix.arch }}-unpacked
          path: Final2x-windows-${{ matrix.arch }}-unpacked.7z

  macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project packages/core --locked --no-default-groups --group dev

      - name: Build bundled core
        run: pnpm run core:bundle

      - name: Smoke-test bundled core
        run: resources/Final2x-core/Final2x-core -h

      - name: Build desktop app
        run: pnpm run build:mac-arm64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename dmg
        run: mv dist/*.dmg dist/Final2x-macos-arm64-dmg.dmg

      - name: Archive unpacked app
        run: 7z a -r Final2x-macos-arm64-unpacked.7z dist/mac-arm64/*

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-macos-arm64-dmg
          path: dist/Final2x-macos-arm64-dmg.dmg

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-macos-arm64-unpacked
          path: Final2x-macos-arm64-unpacked.7z

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run build:linux-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename packages
        run: |
          mv dist/*.snap dist/Final2x-linux-pip-x64-snap.snap
          mv dist/*.AppImage dist/Final2x-linux-pip-x64-AppImage.AppImage
          mv dist/*.deb dist/Final2x-linux-pip-x64-deb.deb

      - name: Archive unpacked app
        run: 7z a -r dist/Final2x-linux-pip-x64-unpacked.7z dist/linux-unpacked/*

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Final2x-linux-pip-x64
          path: |
            dist/Final2x-linux-pip-x64-snap.snap
            dist/Final2x-linux-pip-x64-AppImage.AppImage
            dist/Final2x-linux-pip-x64-deb.deb
            dist/Final2x-linux-pip-x64-unpacked.7z

  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/Final2x-core
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: packages/core/dist

      - name: Publish Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/core/dist/

  github-release:
    needs: [windows, macos, linux, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release artifacts
        run: |
          mkdir dist
          find artifacts -type f -print0 | xargs -0 -I{} cp "{}" dist/
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
