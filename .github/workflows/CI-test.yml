name: CI-test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock

      - name: Install dependencies
        run: uv sync --project core --locked

      - name: Check shared version
        run: node scripts/sync-core-version.mjs --check

      - name: Check generated frontend model options
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run --project core python core/scripts/gen_pretrained_model_name.py --output src/renderer/src/utils/modelOptions.ts
          git diff --exit-code -- src/renderer/src/utils/modelOptions.ts

      - name: Lint Python core
        run: |
          uv run --project core ruff check core
          uv run --project core ruff format --check core
          uv run --project core mypy --config-file core/pyproject.toml core/Final2x_core core/tests

      - name: Test Python core
        run: |
          uv run --project core python core/scripts/gen_config.py
          uv run --project core pytest core/tests --cov=Final2x_core --cov-report=xml:core/coverage.xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/coverage.xml

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - name: Build wheel and source distribution
        run: uv build core

      - name: Smoke-test CLI
        run: uv run --project core Final2x-core -h

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: core/dist/*
